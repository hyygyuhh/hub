<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 架集管理后台</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css?v=20261012d">
</head>
<body>
    <div class="login-screen">
        <div class="login-atmosphere" aria-hidden="true"></div>
        <div class="login-stage">
            <header class="login-brand-block">
                <p class="login-kicker">ShelfHub Console</p>
                <h1 class="login-logo">架集</h1>
                <p class="login-tagline">使用管理员账号与密码登录</p>
            </header>
            <form id="loginForm" class="login-form" autocomplete="on">
                <label class="field">
                    <span>账号</span>
                    <input type="text" id="loginUsername" name="username" required autocomplete="username" placeholder="管理员账号" spellcheck="false" autocapitalize="off">
                </label>
                <label class="field">
                    <span>密码</span>
                    <div class="password-row">
                        <input type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="管理员密码">
                        <button type="button" class="text-btn" id="togglePassword" aria-pressed="false">显示</button>
                    </div>
                </label>
                <label class="remember-row">
                    <input type="checkbox" id="rememberUser" checked>
                    <span>记住账号</span>
                </label>
                <p class="field-note">线上账号 / 密码以 Cloudflare 环境变量为准，改本地 <code>.dev.vars</code> 不会同步。</p>
                <p class="form-error" id="loginError" role="alert" hidden></p>
                <button type="submit" class="btn-primary btn-wide" id="loginBtn">
                    <span class="btn-label">进入后台</span>
                </button>
            </form>
        </div>
    </div>
    <script src="login.js?v=20261012d"></script>
</body>
</html>
